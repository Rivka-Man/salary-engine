{% extends "base.html" %}
{% block title %}הזנת מורה חדש{% endblock %}
{% block content %}
<section class="panel">
  <div class="panel-head">
    <span class="panel-title">הזנת מורה חדש</span>
  </div>
  <form class="panel-body" method="post" action="{{ url_for('new_teacher') }}">
    <div class="form-grid">
      <div class="field">
        <label for="full_name">שם מלא *</label>
        <input type="text" id="full_name" name="full_name" required value="{{ form.full_name if form else '' }}">
      </div>
      <div class="field">
        <label for="reform_start_year">שנת תחילה ברפורמת עוז לתמורה</label>
        <select id="reform_start_year" name="reform_start_year">
          <option value="">— לא רלוונטי —</option>
          {% for sy in school_years %}
          <option value="{{ sy }}" {% if form and form.reform_start_year==sy %}selected{% endif %}>{{ sy }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="U_pre">יחידות שהוכרו ערב הרפורמה (U_pre)</label>
        <input type="number" step="0.01" id="U_pre" name="U_pre" value="{{ form.U_pre if form else 0 }}">
      </div>
      <div class="field">
        <label for="H_pre">שעות שנצברו ערב הרפורמה (H_pre)</label>
        <input type="number" step="0.01" id="H_pre" name="H_pre" value="{{ form.H_pre if form else 0 }}">
      </div>
    </div>

    <div class="checkbox-grid">
      <div class="checkbox-row"><input type="checkbox" id="in_reform" name="in_reform" {% if not form or form.in_reform %}checked{% endif %}><label for="in_reform">מועסק בתנאי עוז לתמורה</label></div>
      <div class="checkbox-row"><input type="checkbox" id="is_active_teacher" name="is_active_teacher" {% if not form or form.is_active_teacher %}checked{% endif %}><label for="is_active_teacher">עובד הוראה בפועל ומוסמך</label></div>
      <div class="checkbox-row"><input type="checkbox" id="has_seniority_year" name="has_seniority_year" {% if not form or form.has_seniority_year %}checked{% endif %}><label for="has_seniority_year">השלים שנת ותק אחת</label></div>
      <div class="checkbox-row"><input type="checkbox" id="is_pensioner" name="is_pensioner" {% if form and form.is_pensioner %}checked{% endif %}><label for="is_pensioner">גמלאי</label></div>
      <div class="checkbox-row"><input type="checkbox" id="has_double_degree_gimul" name="has_double_degree_gimul" {% if form and form.has_double_degree_gimul %}checked{% endif %}><label for="has_double_degree_gimul">כבר קיבל גמול כפל תואר בעבר</label></div>
      <div class="checkbox-row"><input type="checkbox" id="has_beinayim_gimul" name="has_beinayim_gimul" {% if form and form.has_beinayim_gimul %}checked{% endif %}><label for="has_beinayim_gimul">כבר קיבל גמול ביניים בעבר</label></div>
    </div>

    <div class="actions-row">
      <button type="submit" class="btn btn-primary">יצירת מורה</button>
      <a href="{{ url_for('index') }}" class="btn btn-ghost">ביטול</a>
    </div>
  </form>
</section>
{% endblock %}
